<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="chip-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Tile background: rounded square, 22% corner radius = ~113px -->
  <rect width="512" height="512" rx="113" fill="url(#tile-grad)"/>

  <!-- Subtle inner glow / highlight at top-left -->
  <ellipse cx="160" cy="140" rx="200" ry="160" fill="#FFFFFF" opacity="0.07"/>

  <!-- Chip shape: rounded rectangle, inner padding ~14% = 72px each side → 368×220 centered -->
  <!-- Chip sits at x=72, y=146, w=368, h=220, rx=32 -->
  <rect x="72" y="146" width="368" height="220" rx="32" fill="url(#chip-grad)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.22"/>

  <!-- Bold "A" letterform, white, centered in chip left zone -->
  <!-- "A" centered at x=210, y=256 -->
  <text
    x="196"
    y="286"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="142"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-4"
  >A</text>

  <!-- Caret / I-beam bar: amber, sits to the right of the A -->
  <!-- Vertical bar: x=271, y=186 to y=326 (height 140) -->
  <rect x="267" y="188" width="14" height="136" rx="7" fill="#F59E0B"/>

  <!-- Optional: tiny serif-like caret top/bottom caps (horizontal serifs on the I-beam) -->
  <rect x="254" y="188" width="40" height="10" rx="5" fill="#F59E0B"/>
  <rect x="254" y="314" width="40" height="10" rx="5" fill="#F59E0B"/>

</svg>
